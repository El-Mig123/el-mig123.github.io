<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Console — FleetView</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #1C2E21;
      --surface:      #233528;
      --surface-2:    #293E2E;
      --surface-3:    #2F4634;
      --border:       rgba(255,255,255,0.07);
      --border-mid:   rgba(255,255,255,0.12);
      --cream:        #E8E2CC;
      --cream-dim:    rgba(232,226,204,0.55);
      --cream-faint:  rgba(232,226,204,0.22);
      --gray:         #7A8C7E;
      --gray-dim:     rgba(122,140,126,0.18);
      --lemon:        #DCF06A;
      --lemon-dim:    rgba(220,240,106,0.13);
      --lemon-mid:    rgba(220,240,106,0.22);
      --green:        #52C786;
      --green-dim:    rgba(82,199,134,0.14);
      --red:          #E07A7A;
      --red-dim:      rgba(224,122,122,0.14);
      --amber:        #D4A84B;
      --amber-dim:    rgba(212,168,75,0.14);
      --shadow:       0 4px 28px rgba(0,0,0,0.45);
    }

    ::selection { background: var(--lemon); color: var(--bg); }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--cream);
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
    }

    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      text-decoration: none;
    }

    .brand-icon {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--lemon);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg { display: block; }

    .brand-name {
      font-size: 0.95rem; font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--cream);
    }

    .brand-tag {
      font-size: 0.7rem; font-weight: 400;
      color: var(--gray);
      padding: 0.15rem 0.5rem;
      border: 1px solid var(--border-mid);
      border-radius: 3px;
    }

    /* ── TABS ── */
    .tab-bar {
      display: flex; gap: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px; padding: 3px;
    }

    .tab-btn {
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 0.75rem;
      letter-spacing: 0.01em;
      color: var(--gray);
      background: transparent;
      border: none; cursor: pointer;
      padding: 0.38rem 1rem;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--surface-3);
      color: var(--cream);
    }

    .tab-btn:not(.active):hover { color: var(--cream-dim); }

    /* ── META BAR ── */
    .meta-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.4rem 2rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem; font-weight: 400;
      color: var(--gray);
    }

    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--green);
      margin-right: 0.45rem;
      animation: pulse-dot 2.2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── MAIN ── */
    main {
      padding-top: 60px;
    }

    .screen {
      display: none;
      padding: 2rem 2rem 3.5rem;
      animation: screenIn 0.25s ease both;
    }

    .screen.active { display: block; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCREEN HEADER ── */
    .screen-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .screen-title {
      font-size: 1rem; font-weight: 600;
      color: var(--cream);
    }

    .screen-label {
      font-size: 0.7rem; font-weight: 400;
      color: var(--gray);
    }

    .gold-rule { display: none; }

    /* ── TABLE ── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    table {
      width: 100%; border-collapse: collapse;
      background: var(--surface);
    }

    thead tr {
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-mid);
    }

    th {
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--gray); padding: 0.75rem 1.25rem;
      text-align: left; white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }

    td { padding: 0.9rem 1.25rem; vertical-align: middle; }

    .task-name {
      font-size: 0.875rem; font-weight: 500;
      color: var(--cream);
      white-space: nowrap;
    }

    .task-agent {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem; font-weight: 400;
      color: var(--gray);
      margin-top: 3px;
    }

    /* ── STATUS BADGES ── */
    .status-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.25rem 0.6rem; border-radius: 4px;
      white-space: nowrap;
    }

    .status-badge .dot {
      width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    }

    .badge-running   { background: var(--lemon-dim);  color: var(--lemon);  }
    .badge-running .dot { background: var(--lemon); animation: pulse-dot 2s ease infinite; }

    .badge-pending   { background: var(--amber-dim);  color: var(--amber);  }
    .badge-pending .dot { background: var(--amber); }

    .badge-failed    { background: var(--red-dim);    color: var(--red);    }
    .badge-failed .dot { background: var(--red); }

    .badge-completed { background: var(--green-dim);  color: var(--green);  }
    .badge-completed .dot { background: var(--green); }

    .badge-escalated {
      background: rgba(212,168,75,0.10);
      color: var(--amber);
      border: 1px solid rgba(212,168,75,0.3);
    }
    .badge-escalated .dot { background: var(--amber); animation: pulse-dot 1.6s ease infinite; }

    /* ── ACTION BUTTONS ── */
    .action-group { display: flex; gap: 0.35rem; flex-wrap: nowrap; }

    .btn {
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 0.68rem;
      letter-spacing: 0.01em;
      border: 1px solid; border-radius: 5px;
      padding: 0.3rem 0.7rem;
      cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.08s;
      background: transparent;
    }

    .btn:active { transform: scale(0.95); }

    .btn-approve  { border-color: rgba(82,199,134,0.4); color: var(--green); }
    .btn-approve:hover  { background: var(--green-dim); border-color: var(--green); }

    .btn-reject   { border-color: rgba(224,122,122,0.4); color: var(--red); }
    .btn-reject:hover   { background: var(--red-dim); border-color: var(--red); }

    .btn-rerun    { border-color: var(--border-mid); color: var(--gray); }
    .btn-rerun:hover    { background: var(--gray-dim); color: var(--cream); border-color: rgba(255,255,255,0.2); }

    .btn-escalate { border-color: rgba(212,168,75,0.4); color: var(--amber); }
    .btn-escalate:hover { background: var(--amber-dim); border-color: var(--amber); }

    /* ── ROI GRID ── */
    .roi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.2rem;
    }

    .roi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .roi-card:hover {
      border-color: var(--border-mid);
      transform: translateY(-1px);
    }

    .roi-card-header {
      padding: 1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between;
      background: var(--surface-2);
    }

    .roi-card-title {
      font-size: 0.9rem; font-weight: 600;
      color: var(--cream);
    }

    .roi-card-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem; color: var(--gray);
      margin-top: 3px;
    }

    .verdict {
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.22rem 0.6rem; border-radius: 4px;
      flex-shrink: 0; margin-left: 0.75rem; margin-top: 1px;
    }

    .verdict-scale   { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(82,199,134,0.3); }
    .verdict-kill    { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(224,122,122,0.3); }
    .verdict-monitor { background: var(--amber-dim);  color: var(--amber);  border: 1px solid rgba(212,168,75,0.3); }

    .roi-stats {
      padding: 1rem 1.25rem;
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }

    .stat-label {
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1.4rem; font-weight: 600;
      color: var(--cream); line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat-unit {
      font-size: 0.62rem; font-weight: 400;
      color: var(--gray);
      margin-top: 3px;
    }

    /* ── RATE BAR ── */
    .rate-bar-wrap { padding: 0 1.25rem 1.1rem; }

    .rate-bar-label {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 0.45rem;
    }

    .rate-bar-label span:first-child {
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--gray);
    }

    .rate-bar-label .rate-pct {
      font-size: 0.78rem; font-weight: 600;
      color: var(--cream);
    }

    .rate-bar-track {
      height: 3px;
      background: var(--border-mid);
      border-radius: 99px; overflow: hidden;
    }

    .rate-bar-fill {
      height: 100%; border-radius: 99px;
      transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fill-high { background: var(--green); }
    .fill-mid  { background: var(--lemon); }
    .fill-low  { background: var(--red); }

    /* ── ROI SUMMARY ── */
    .roi-summary {
      padding: 0.75rem 1.25rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem; font-weight: 400; line-height: 1.55;
      color: var(--cream-dim);
    }

    /* ── TOAST ── */
    #toast-container {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      z-index: 9999;
      display: flex; flex-direction: column; gap: 0.5rem;
    }

    .toast {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem; font-weight: 400;
      background: var(--surface-3);
      color: var(--cream);
      border: 1px solid var(--border-mid);
      border-left: 3px solid var(--lemon);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      box-shadow: var(--shadow);
      animation: toast-in 0.25s ease both;
      max-width: 300px;
    }

    .toast.fade-out { animation: toast-out 0.25s ease forwards; }

    @keyframes toast-in  { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    @keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(14px); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .action-group { flex-wrap: wrap; }
      .roi-stats { grid-template-columns: 1fr 1fr; }
      .header-inner { padding: 0 1rem; }
      .screen { padding: 1.5rem 1rem 3rem; }
      th, td { padding: 0.7rem 0.8rem; }
    }

    @media (max-width: 500px) {
      .brand-tag { display: none; }
      .meta-bar { flex-direction: column; gap: 0.25rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="agent-console.html">
      <span class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="1" width="5" height="5" rx="1" fill="#101A12"/>
          <rect x="8" y="1" width="5" height="5" rx="1" fill="#101A12"/>
          <rect x="1" y="8" width="5" height="5" rx="1" fill="#101A12"/>
          <rect x="8" y="8" width="5" height="5" rx="1" fill="#101A12" opacity="0.4"/>
        </svg>
      </span>
      <span class="brand-name">FleetView</span>
      <span class="brand-tag">Agent Console</span>
    </a>
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="operator">Operator View</button>
      <button class="tab-btn" data-tab="roi">ROI Panel</button>
    </nav>
  </div>
  <div class="meta-bar">
    <span><span class="live-dot"></span>Live · 6 active agents</span>
    <span>Last sync: just now</span>
  </div>
</header>

<main>

  <!-- ── SCREEN 1: OPERATOR VIEW ── -->
  <section class="screen active" id="screen-operator">
    <div class="screen-header">
      <h1 class="screen-title">Operator View</h1>
      <span class="screen-label">Active agent tasks</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Task</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="task-table-body">
          <!-- rows injected by JS -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- ── SCREEN 2: ROI PANEL ── -->
  <section class="screen" id="screen-roi">
    <div class="screen-header">
      <h1 class="screen-title">ROI Panel</h1>
      <span class="screen-label">Scale or kill decisions</span>
    </div>

    <div class="roi-grid" id="roi-grid">
      <!-- cards injected by JS -->
    </div>
  </section>

</main>

<div id="toast-container"></div>

<script>
  /* ── DATA ── */
  const tasks = [
    { id: 1, name: 'Email Triage',             agent: 'inbox-agent-v2',      status: 'running'   },
    { id: 2, name: 'Invoice Processing',        agent: 'finance-agent-v1',    status: 'pending'   },
    { id: 3, name: 'Customer Sentiment',        agent: 'analytics-agent-v3',  status: 'failed'    },
    { id: 4, name: 'Contract Review',           agent: 'legal-agent-v1',      status: 'running'   },
    { id: 5, name: 'Lead Qualification',        agent: 'sales-agent-v2',      status: 'completed' },
    { id: 6, name: 'Report Generation',         agent: 'reporting-agent-v1',  status: 'escalated' },
  ];

  const agents = [
    {
      name: 'Email Triage',
      agent: 'inbox-agent-v2',
      costPerTask: '$0.04',
      timeSaved: '12 min',
      successRate: 94,
      verdict: 'scale',
      summary: 'Consistent throughput at minimal cost. Handles 300+ tasks/day with no human touchpoints needed.',
    },
    {
      name: 'Invoice Processing',
      agent: 'finance-agent-v1',
      costPerTask: '$0.18',
      timeSaved: '45 min',
      successRate: 88,
      verdict: 'scale',
      summary: 'Strong time-savings ratio. Each automated task recovers nearly an hour of manual AP work.',
    },
    {
      name: 'Customer Sentiment',
      agent: 'analytics-agent-v3',
      costPerTask: '$0.07',
      timeSaved: '8 min',
      successRate: 71,
      verdict: 'monitor',
      summary: 'Accuracy slipping on edge-case sentiment. Monitor for another sprint before committing to scale.',
    },
    {
      name: 'Contract Review',
      agent: 'legal-agent-v1',
      costPerTask: '$2.30',
      timeSaved: '3.2 hrs',
      successRate: 82,
      verdict: 'scale',
      summary: 'Highest per-task cost, but the 3+ hour time savings per contract drives exceptional ROI.',
    },
    {
      name: 'Lead Qualification',
      agent: 'sales-agent-v2',
      costPerTask: '$0.12',
      timeSaved: '22 min',
      successRate: 68,
      verdict: 'monitor',
      summary: 'Success rate below threshold. Conversion quality needs improvement before expanding volume.',
    },
    {
      name: 'Report Generation',
      agent: 'reporting-agent-v1',
      costPerTask: '$0.95',
      timeSaved: '1.5 hrs',
      successRate: 55,
      verdict: 'kill',
      summary: 'Failure rate exceeds 45%. Human review is required on more than half of outputs — killing efficiency gains.',
    },
  ];

  /* ── STATUS CONFIG ── */
  const statusMap = {
    running:   { cls: 'badge-running',   label: 'Running'   },
    pending:   { cls: 'badge-pending',   label: 'Pending'   },
    failed:    { cls: 'badge-failed',    label: 'Failed'    },
    completed: { cls: 'badge-completed', label: 'Completed' },
    escalated: { cls: 'badge-escalated', label: 'Escalated' },
  };

  /* ── RENDER OPERATOR TABLE ── */
  function renderTable() {
    const tbody = document.getElementById('task-table-body');
    tbody.innerHTML = tasks.map(t => {
      const s = statusMap[t.status];
      return `
        <tr data-id="${t.id}">
          <td>
            <div class="task-name">${t.name}</div>
            <div class="task-agent">${t.agent}</div>
          </td>
          <td>
            <span class="status-badge ${s.cls}">
              <span class="dot"></span>${s.label}
            </span>
          </td>
          <td>
            <div class="action-group">
              <button class="btn btn-approve" onclick="handleAction(${t.id},'approve')">Approve</button>
              <button class="btn btn-reject"  onclick="handleAction(${t.id},'reject')">Reject</button>
              <button class="btn btn-rerun"   onclick="handleAction(${t.id},'rerun')">Re-run</button>
              <button class="btn btn-escalate" onclick="handleAction(${t.id},'escalate')">Escalate</button>
            </div>
          </td>
        </tr>`;
    }).join('');
  }

  /* ── RENDER ROI CARDS ── */
  function renderROI() {
    const grid = document.getElementById('roi-grid');
    grid.innerHTML = agents.map(a => {
      const fillCls = a.successRate >= 80 ? 'fill-high' : a.successRate >= 65 ? 'fill-mid' : 'fill-low';
      const verdictCls = a.verdict === 'scale' ? 'verdict-scale' : a.verdict === 'kill' ? 'verdict-kill' : 'verdict-monitor';
      const verdictLabel = a.verdict === 'scale' ? 'Scale' : a.verdict === 'kill' ? 'Kill' : 'Monitor';
      return `
        <article class="roi-card">
          <div class="roi-card-header">
            <div>
              <div class="roi-card-title">${a.name}</div>
              <div class="roi-card-sub">${a.agent}</div>
            </div>
            <span class="verdict ${verdictCls}">${verdictLabel}</span>
          </div>
          <div class="roi-stats">
            <div class="stat-item">
              <div class="stat-label">Cost / task</div>
              <div class="stat-value">${a.costPerTask}</div>
              <div class="stat-unit">per execution</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Time saved</div>
              <div class="stat-value">${a.timeSaved}</div>
              <div class="stat-unit">vs manual</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Success</div>
              <div class="stat-value">${a.successRate}%</div>
              <div class="stat-unit">pass rate</div>
            </div>
          </div>
          <div class="rate-bar-wrap">
            <div class="rate-bar-label">
              <span>Success rate</span>
              <span class="rate-pct">${a.successRate}%</span>
            </div>
            <div class="rate-bar-track">
              <div class="rate-bar-fill ${fillCls}" style="width:${a.successRate}%"></div>
            </div>
          </div>
          <div class="roi-summary">${a.summary}</div>
        </article>`;
    }).join('');
  }

  /* ── TOAST ── */
  const toastMessages = {
    approve:  (name) => `Approved: ${name}`,
    reject:   (name) => `Rejected: ${name}`,
    rerun:    (name) => `Re-running: ${name}`,
    escalate: (name) => `Escalated: ${name} — assigned to on-call operator`,
  };

  function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => {
      el.classList.add('fade-out');
      el.addEventListener('animationend', () => el.remove());
    }, 3000);
  }

  /* ── ACTION HANDLER ── */
  function handleAction(id, action) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    if (action === 'rerun') {
      task.status = 'running';
    } else if (action === 'escalate') {
      task.status = 'escalated';
    } else if (action === 'approve') {
      task.status = 'completed';
    } else if (action === 'reject') {
      task.status = 'failed';
    }

    renderTable();
    showToast(toastMessages[action](task.name));
  }

  /* ── TAB SWITCHING ── */
  const tabBtns = document.querySelectorAll('.tab-btn');
  const screens = { operator: document.getElementById('screen-operator'), roi: document.getElementById('screen-roi') };

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.entries(screens).forEach(([key, el]) => {
        el.classList.toggle('active', key === target);
      });
    });
  });

  /* ── INIT ── */
  renderTable();
  renderROI();
</script>
</body>
</html>
